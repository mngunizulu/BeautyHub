      responses:
        "200":
          description: Campaign drafts
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/MarketingCampaign" } }
    post:
      operationId: createMarketingCampaign
      tags: [marketing]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MarketingCampaignInput" }
      responses:
        "201":
          description: Draft saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MarketingCampaign" }
  /organizations/{organizationId}/marketing-campaigns/{id}:
    put:
      operationId: updateMarketingCampaign
      tags: [marketing]
      parameters:
        - { in: path, name: organizationId, required: true, schema: { type: string, format: uuid } }
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MarketingCampaignInput" }
      responses:
        "200":
          description: Draft saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MarketingCampaign" }
  /organizations/{organizationId}/marketing-campaigns/{id}/captures:
    parameters:
      - { $ref: "#/components/parameters/OrganizationId" }
      - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: listMarketingCaptures
      tags: [marketing]
      responses:
        "200":
          description: Recent local captures
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/MarketingCapture" } }
    post:
      operationId: createMarketingCapture
      tags: [marketing]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MarketingCaptureInput" }
      responses:
        "200":
          description: Existing capture for this idempotency key
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MarketingCapture" }
        "201":
          description: Local capture recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MarketingCapture" }
  /organizations/{organizationId}/marketing-campaigns/audience:
    get:
      operationId: getMarketingAudienceCount
      tags: [marketing]
      parameters:
        - { in: path, name: organizationId, required: true, schema: { type: string, format: uuid } }
        - { in: query, name: segment, required: true, schema: { type: string, enum: [completed, repeat] } }
      responses:
        "200":
          description: Number of eligible opted-in customers in the audience
          content:
            application/json:
              schema: { type: object, required: [count], properties: { count: { type: integer } } }
components:
  parameters:
    OrganizationId:
      name: organizationId
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
  schemas:
    BusinessMarketingPreferenceInput:
      type: object
      required: [consent]
      properties:
        consent: { type: boolean }
    BusinessMarketingPreference:
      type: object
      required: [organizationId, name, consent]
      properties:
        organizationId: { type: string, format: uuid }
        name: { type: string }
        consent: { type: boolean }
    MarketingCaptureInput:
      type: object
      required: [idempotencyKey]
      properties:
        idempotencyKey: { type: string, format: uuid }
    MarketingCapture:
      type: object
      required: [id, count, createdAt]
      properties:
        id: { type: string, format: uuid }
        count: { type: integer, minimum: 0 }
        createdAt: { type: string, format: date-time }
    MarketingTemplate:
      allOf:
        - $ref: "#/components/schemas/MarketingCampaignInput"
        - type: object
          required: [id, organizationId, updatedAt]
          properties:
            id: { type: string, format: uuid }
            organizationId: { type: string, format: uuid }
            updatedAt: { type: string, format: date-time }
    MarketingCampaignInput:
      type: object
      required: [title, subject, body, segment]
      properties:
        title: { type: string, minLength: 1, maxLength: 120 }
        subject: { type: string, minLength: 1, maxLength: 160 }
        body: { type: string, minLength: 1, maxLength: 4000 }
        segment: { type: string, enum: [completed, repeat] }
    MarketingCampaign:
      allOf:
        - $ref: "#/components/schemas/MarketingCampaignInput"
        - type: object
          required: [id, organizationId, updatedAt]
          properties:
            id: { type: string, format: uuid }
            organizationId: { type: string, format: uuid }
            updatedAt: { type: string, format: date-time }
    InventorySupplierInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        email: { type: string }
        phone: { type: string, maxLength: 30 }
    InventorySupplier:
      type: object
      required: [id, locationId, name, email, phone]
      properties:
        id: { type: string, format: uuid }
        locationId: { type: string, format: uuid }
        name: { type: string }
        email: { type: string }
        phone: { type: string }
    InventoryPurchaseOrderInput:
      type: object
      required: [idempotencyKey, supplierId, items]
      properties:
        idempotencyKey: { type: string, format: uuid }
        supplierId: { type: string, format: uuid }
        items:
          type: array
          minItems: 1
          maxItems: 30
          items:
            type: object
            required: [productId, quantity]
            properties:
              productId: { type: string, format: uuid }
              quantity: { type: integer, minimum: 1, maximum: 1000000 }
    InventoryOrderReceiptInput:
      type: object
      required: [idempotencyKey, items]
      properties:
        idempotencyKey: { type: string, format: uuid }
        items:
          type: array
          minItems: 1
          maxItems: 30
          items:
            type: object
            required: [productId, quantity]
            properties:
              productId: { type: string, format: uuid }
              quantity: { type: integer, minimum: 1, maximum: 1000000 }
    InventoryOrderStatusInput:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [received, cancelled] }
    InventoryPurchaseOrder:
      type: object
      required: [id, locationId, supplierId, supplierName, actorId, idempotencyKey, items, status, createdAt, closedAt]
      properties:
        id: { type: string, format: uuid }
        locationId: { type: string, format: uuid }
        supplierId: { type: string, format: uuid }
        supplierName: { type: string }
        actorId: { type: string, format: uuid }
        idempotencyKey: { type: string, format: uuid }
        status: { type: string, enum: [open, received, cancelled] }
        createdAt: { type: string, format: date-time }
        closedAt: { type: string, format: date-time, nullable: true }
        items:
          type: array
          items:
            type: object
            required: [productId, sku, name, quantity]
            properties:
              productId: { type: string, format: uuid }
              sku: { type: string }
              name: { type: string }
              quantity: { type: integer }
              purchaseCostCents: { type: integer, nullable: true }
              receivedQuantity: { type: integer, minimum: 0 }
    InventoryProductInput:
      type: object
      required: [sku, name, category, supplier, imageUrl, unitCents, reorderAt]
      properties:
        sku: { type: string, minLength: 1, maxLength: 40 }
        name: { type: string, minLength: 1, maxLength: 120 }
        category: { type: string, maxLength: 120 }
        supplier: { type: string, maxLength: 120 }
        imageUrl: { type: string, maxLength: 500 }
        purchaseCostCents: { type: integer, minimum: 0, maximum: 10000000, nullable: true }
        unitCents: { type: integer, minimum: 1, maximum: 10000000 }
        reorderAt: { type: integer, minimum: 0, maximum: 1000000 }
        archived: { type: boolean }
    InventoryProduct:
      allOf:
        - $ref: "#/components/schemas/InventoryProductInput"
        - type: object
          required: [id, locationId, stock, archived]
          properties:
            id: { type: string, format: uuid }
            locationId: { type: string, format: uuid }
            stock: { type: integer, minimum: 0 }
            archived: { type: boolean }
    InventoryMovementInput:
      type: object
      required: [idempotencyKey, kind, quantity, reason]
      properties:
        idempotencyKey: { type: string, format: uuid }
        kind: { type: string, enum: [receipt, adjustment] }
        quantity: { type: integer, minimum: -1000000, maximum: 1000000 }
        reason: { type: string, minLength: 1, maxLength: 240 }
    InventoryMovement:
      type: object
      required: [id, productId, actorId, idempotencyKey, kind, quantity, reason, balance, createdAt]
      properties:
        id: { type: string, format: uuid }
        productId: { type: string, format: uuid }
        actorId: { type: string, format: uuid }
        idempotencyKey: { type: string, format: uuid }
        kind: { type: string, enum: [receipt, adjustment, sale] }
        quantity: { type: integer }
        balance: { type: integer }
        reason: { type: string }
        createdAt: { type: string, format: date-time }
    ProfessionalPricingSettings:
      type: object
      required: [differentialPricing, allowProfessionalChoice, allowAnyProfessional]
      properties:
        differentialPricing: { type: boolean }
        allowProfessionalChoice: { type: boolean }
        allowAnyProfessional: { type: boolean }
    ProfessionalProfileInput:
      type: object
      required: [professionalTitle, professionalPhotoUrl]
      properties:
        professionalTitle: { type: string, maxLength: 100 }
        professionalPhotoUrl: { type: string, maxLength: 1000 }
    ProfessionalOverrideInput:
      type: object
      required: [employeeId, serviceId, variantId, priceCents, durationMinutes]
      properties:
        employeeId: { type: string, format: uuid }
        serviceId: { type: string, format: uuid }
        variantId: { type: [string, "null"], format: uuid }
        priceCents: { type: [integer, "null"], minimum: 0, maximum: 10000000 }
        durationMinutes: { type: [integer, "null"], minimum: 1, maximum: 720 }
    CalendarMoveDate: { type: object, required: [date], properties: { date: { type: string, format: date } } }
    CalendarMoveInput: { type: object, required: [startsAt, employeeId, expectedStartsAt, expectedEmployeeId], properties: { startsAt: { type: string, format: date-time }, employeeId: { type: string, format: uuid }, expectedStartsAt: { type: string, format: date-time }, expectedEmployeeId: { type: string, format: uuid } } }
    StaffBreak: { type: object, required: [weekday, begins, ends], properties: { weekday: { type: integer, minimum: 1, maximum: 7 }, begins: { type: string }, ends: { type: string } } }
    StaffBreakList: { type: array, items: { $ref: "#/components/schemas/StaffBreak" } }
    CrmCustomerInput: { type: object, required: [name, email, phone, contactPreference, notes, tags], properties: { name: { type: string }, email: { type: string }, phone: { type: string }, contactPreference: { type: string, enum: [none, email, phone] }, notes: { type: string }, tags: { type: array, items: { type: string } } } }
    CrmCustomerUpdate: { type: object, required: [name, email, phone, contactPreference, notes, tags, revision], properties: { name: { type: string }, email: { type: string }, phone: { type: string }, contactPreference: { type: string, enum: [none, email, phone] }, notes: { type: string }, tags: { type: array, items: { type: string } }, revision: { type: integer } } }
    CrmCustomer: { type: object, required: [id, name, email, phone, contactPreference, notes, tags, revision, updatedAt], properties: { id: { type: string, format: uuid }, name: { type: string }, email: { type: string }, phone: { type: string }, contactPreference: { type: string, enum: [none, email, phone] }, notes: { type: string }, tags: { type: array, items: { type: string } }, revision: { type: integer }, updatedAt: { type: string, format: date-time }, completedVisits: { type: integer } } }
    CrmVisit: { type: object, required: [bookingId, startsAt, status, salon, timezone, items], properties: { bookingId: { type: string, format: uuid }, startsAt: { type: string, format: date-time }, status: { type: string }, salon: { type: string }, timezone: { type: string }, items: { type: array, items: { type: object, additionalProperties: true } }, name: { type: string } } }
    CrmAttachment: { type: object, required: [id, name, createdAt], properties: { id: { type: string, format: uuid }, name: { type: string }, createdAt: { type: string, format: date-time } } }
    CalendarAppointmentSelection:
      type: object
      required: [locationId, date, items, source]
      properties:
        locationId: { type: string, format: uuid }
        date: { type: string, format: date }
        items:
          type: array
          minItems: 1
          maxItems: 12
          items: { $ref: "#/components/schemas/CalendarAppointmentItem" }
        source: { type: string, enum: [manual, walk_in] }
    CalendarAppointmentItem:
      type: object
      required: [serviceId]
      properties:
        serviceId: { type: string, format: uuid }
        variantId: { type: string, format: uuid }
    CalendarAppointmentInput:
      type: object
      required: [locationId, items, source, employeeId, startsAt, idempotencyKey, guestName]
      properties:
        locationId: { type: string, format: uuid }
        items:
          type: array
          minItems: 1
          maxItems: 12
          items: { $ref: "#/components/schemas/CalendarAppointmentItem" }
        source: { type: string, enum: [manual, walk_in] }
        employeeId: { type: string, format: uuid }
        startsAt: { type: string, format: date-time }
        idempotencyKey: { type: string, format: uuid }
        guestName: { type: string, minLength: 1, maxLength: 100 }
    BookingSlot:
      type: object
      required: [employeeId, employeeName, startsAt, endsAt]
      properties:
        employeeId: { type: string, format: uuid }
        employeeName: { type: string }
        professionalTitle: { type: string }
        professionalPhotoUrl: { type: string }
        mixed: { type: boolean }
        quote: { $ref: "#/components/schemas/BookingQuote" }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
    BookingAvailability:
      type: object
      required: [quote, slots, policy]
      properties:
        quote: { $ref: "#/components/schemas/BookingQuote" }
        slots: { type: array, items: { $ref: "#/components/schemas/BookingSlot" } }
        professionalChoice:
          type: object
          required: [individual, any]
          properties:
            individual: { type: boolean }
            any: { type: boolean }
        policy: { type: [object, "null"], additionalProperties: true }
    AvailableDatesInput: { type: object, required: [from, items], properties: { from: { type: string, format: date }, items: { type: array, minItems: 1, maxItems: 12, items: { type: object, required: [serviceId], properties: { serviceId: { type: string, format: uuid }, variantId: { type: string, format: uuid } } } } } }
    PosVoucherQuote:
      type: object
      required: [code, discountCents]
      properties:
        code: { type: string, pattern: '^[A-Z0-9-]{4,32}$' }
        discountCents: { type: integer, minimum: 1, maximum: 2147483647 }
    GiftVoucherInput:
      type: object
      required: [discountCents, requestId]
      properties:
        discountCents: { type: integer, minimum: 1, maximum: 100000 }
        requestId: { type: string, format: uuid }
    PosVoucherInput:
      allOf:
        - $ref: "#/components/schemas/PosVoucherQuote"
        - type: object
          properties:
            expiresAt: { type: string, format: date-time }
    PosVoucher:
      allOf:
        - $ref: "#/components/schemas/PosVoucherQuote"
        - type: object
          required: [id, organizationId, expiresAt, redeemedAt]
          properties:
            isGift: { type: boolean }
            id: { type: string, format: uuid }
            organizationId: { type: string, format: uuid }
            expiresAt: { type: string, format: date-time, nullable: true }
            redeemedAt: { type: string, format: date-time, nullable: true }
    RetailSaleInput:
      type: object
      required: [idempotencyKey, method, items]
      properties:
        idempotencyKey: { type: string, format: uuid }
        voucherCode: { type: string, minLength: 4, maxLength: 32, nullable: true }
        method: { type: string, enum: [cash, simulated_card] }
        items:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: object
            required: [description, unitCents, quantity]
            properties:
              productId: { type: string, format: uuid }
              description: { type: string, minLength: 1, maxLength: 120 }
              unitCents: { type: integer, minimum: 1, maximum: 10000000 }
              quantity: { type: integer, minimum: 1, maximum: 100 }
    RetailSale:
      allOf:
        - $ref: "#/components/schemas/RetailSaleInput"
        - type: object
          required: [id, locationId, actorId, amountCents, createdAt]
          properties:
            id: { type: string, format: uuid }
            locationId: { type: string, format: uuid }
            actorId: { type: string, format: uuid }
            amountCents: { type: integer }
            discountCents: { type: integer }
            createdAt: { type: string, format: date-time }
    RetailRefund:
      allOf:
        - $ref: "#/components/schemas/AppointmentRefundInput"
        - type: object
          required: [id, saleId, actorId, createdAt]
          properties:
            id: { type: string, format: uuid }
            saleId: { type: string, format: uuid }
            actorId: { type: string, format: uuid }
            createdAt: { type: string, format: date-time }
    RetailSaleBalance:
      type: object
      required: [sale, refunds, refundableCents]
      properties:
        sale: { $ref: "#/components/schemas/RetailSale" }
        refunds: { type: array, items: { $ref: "#/components/schemas/RetailRefund" } }
        refundableCents: { type: integer }
    AppointmentTransactionReport:
      type: object
      required: [count, date, timezone, currency, totals, entries]
      properties:
        count: { type: integer }
        date: { type: string, format: date }
        timezone: { type: string }
        currency: { type: string, enum: [EUR] }
        totals:
          type: array
          items:
            type: object
            required: [method, receivedCents, refundedCents, discountCents]
            properties:
              method: { type: string, enum: [cash, simulated_card] }
              receivedCents: { type: integer }
              discountCents: { type: integer }
              refundedCents: { type: integer }
        entries:
          type: array
          items:
            type: object
            required: [id, bookingId, paymentId, recordedAt, method, kind, amountCents, discountCents]
            properties:
              id: { type: string, format: uuid }
              bookingId: { type: string, format: uuid, nullable: true }
              paymentId: { type: string, format: uuid }
              recordedAt: { type: string, format: date-time }
              discountCents: { type: integer }
              method: { type: string, enum: [cash, simulated_card] }
              kind: { type: string, enum: [deposit, settlement, refund, retail, retail_refund] }
              amountCents: { type: integer }
    AppointmentPaymentInput:
      type: object
      required: [idempotencyKey, amountCents, kind, method]
      properties:
        idempotencyKey: { type: string, format: uuid }
        voucherCode: { type: string, minLength: 4, maxLength: 32 }
        amountCents: { type: integer, minimum: 1, maximum: 2147483647 }
        discountCents: { type: integer, minimum: 0, maximum: 2147483647 }
        discountReason: { type: string, minLength: 1, maxLength: 240 }
        kind: { type: string, enum: [deposit, settlement] }
        method: { type: string, enum: [cash, simulated_card] }
    AppointmentPayment:
      type: object
      required: [id, bookingId, actorId, providerReference, createdAt, idempotencyKey, amountCents, kind, method, discountCents, discountReason]
      properties:
        idempotencyKey: { type: string, format: uuid }
        amountCents: { type: integer }
        kind: { type: string, enum: [deposit, settlement] }
        method: { type: string, enum: [cash, simulated_card] }
        discountCents: { type: integer }
        voucherCode: { type: string, nullable: true }
        discountReason: { type: string, nullable: true }
        id: { type: string, format: uuid }
        bookingId: { type: string, format: uuid }
        actorId: { type: string, format: uuid }
        providerReference: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
    AppointmentRefundInput:
      type: object
      required: [idempotencyKey, amountCents, reason]
      properties:
        idempotencyKey: { type: string, format: uuid }
        amountCents: { type: integer, minimum: 1, maximum: 2147483647 }
        reason: { type: string, minLength: 1, maxLength: 240 }
    AppointmentRefund:
      allOf:
        - $ref: "#/components/schemas/AppointmentRefundInput"
        - type: object
          required: [id, paymentId, actorId, createdAt]
          properties:
            id: { type: string, format: uuid }
            paymentId: { type: string, format: uuid }
            actorId: { type: string, format: uuid }
            createdAt: { type: string, format: date-time }
    MyAppointmentPaymentHistory:
      type: object
      required: [currency, payments, refunds]
      properties:
        packageCoveredCents: { type: integer, minimum: 0 }
        currency: { type: string, enum: [EUR] }
        payments:
          type: array
          items:
            type: object
            required: [id, kind, method, amountCents, discountCents, createdAt]
            properties:
              id: { type: string, format: uuid }
              kind: { type: string, enum: [deposit, settlement] }
              method: { type: string, enum: [cash, simulated_card] }
              amountCents: { type: integer }
              discountCents: { type: integer }
              createdAt: { type: string, format: date-time }
        refunds:
          type: array
          items:
            type: object
            required: [id, paymentId, amountCents, createdAt]
            properties:
              id: { type: string, format: uuid }
              paymentId: { type: string, format: uuid }
              amountCents: { type: integer }
              createdAt: { type: string, format: date-time }
    AppointmentPaymentBalance:
      type: object
      required: [currency, paidCents, outstandingCents, entries, refunds, refundedCents, discountCents]
      properties:
        packageCoveredCents: { type: integer, minimum: 0 }
        currency: { type: string, enum: [EUR] }
        paidCents: { type: integer }
        discountCents: { type: integer }
        outstandingCents: { type: integer }
        refundedCents: { type: integer }
        entries: { type: array, items: { $ref: "#/components/schemas/AppointmentPayment" } }
        refunds: { type: array, items: { $ref: "#/components/schemas/AppointmentRefund" } }
    ReviewModerationInput:
      type: object
      required: [action]
      properties:
        action: { type: string, enum: [dismiss, hide, restore] }
    ReviewModerationPage:
      type: object
      required: [reviews, hasMore]
      properties:
        hasMore: { type: boolean }
        reviews:
          type: array
          items:
            type: object
            required: [id, comment, reply, rating, hidden, location, report]
            properties:
              id: { type: string, format: uuid }
              comment: { type: string }
              reply: { type: string }
              rating: { type: integer, minimum: 1, maximum: 5 }
              hidden: { type: boolean }
              location: { type: string }
              report:
                type: [object, "null"]
                required: [reason, details, pendingCount, reportedAt]
                properties:
                  reason: { type: string, enum: [spam, abuse, personal_information, other] }
                  details: { type: string }
                  pendingCount: { type: integer }
                  reportedAt: { type: string, format: date-time }
    PlatformAnalytics:
      type: object
      required: [business, customers, visits, subscriptions, billing, support, timezone, currency, from, to]
      properties:
        timezone: { type: string, const: Europe/Berlin }
        currency: { type: string, const: EUR }
        from: { type: string, format: date }
        to: { type: string, format: date }
        business:
          type: object
          required: [total, verified, suspended]
          properties:
            total: { type: integer, minimum: 0 }
            verified: { type: integer, minimum: 0 }
            suspended: { type: integer, minimum: 0 }
        customers:
          type: object
          required: [total, deletionRequested]
          properties:
            total: { type: integer, minimum: 0 }
            deletionRequested: { type: integer, minimum: 0 }
        visits:
          type: object
          required: [total, completed, cancelled, noShows]
          properties:
            total: { type: integer, minimum: 0 }
            completed: { type: integer, minimum: 0 }
            cancelled: { type: integer, minimum: 0 }
            noShows: { type: integer, minimum: 0 }
        subscriptions:
          type: object
          required: [trial, active, expired, cancelled]
          properties:
            trial: { type: integer, minimum: 0 }
            active: { type: integer, minimum: 0 }
