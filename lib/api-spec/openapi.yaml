        logoUrl: { type: string, maxLength: 500 }
        website: { type: string, maxLength: 300 }
        categoryId: { type: string, format: uuid }
        onboardingStep: { type: integer, minimum: 1, maximum: 6 }
    HourInput:
      type: object
      required: [weekday, opens, closes]
      properties:
        weekday: { type: integer, minimum: 1, maximum: 7 }
        opens: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
        closes: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
    LocationInput:
      type: object
      required: [name, country, postalCode, city, street, houseNumber, addressExtra, district, timezone, openingHours, leadTimeHours, advanceBookingDays, contactPreference]
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        country: { type: string, enum: [DE] }
        postalCode: { type: string, pattern: '^([0-9]{5})?$' }
        city: { type: string, maxLength: 100 }
        street: { type: string, maxLength: 150 }
        houseNumber: { type: string, maxLength: 20 }
        addressExtra: { type: string, maxLength: 150 }
        district: { type: string, maxLength: 100 }
        timezone: { type: string, maxLength: 80 }
        latitude: { type: [number, "null"], minimum: -90, maximum: 90 }
        longitude: { type: [number, "null"], minimum: -180, maximum: 180 }
        openingHours: { type: array, maxItems: 7, items: { $ref: "#/components/schemas/HourInput" } }
        leadTimeHours: { type: integer, minimum: 0, maximum: 720 }
        advanceBookingDays: { type: integer, minimum: 1, maximum: 730 }
        contactPreference: { type: string, enum: [email, phone] }
    ManagedLocation:
      allOf:
        - $ref: "#/components/schemas/LocationInput"
        - type: object
          required: [id, slug, published]
          properties:
            id: { type: string }
            slug: { type: string }
            published: { type: boolean }
    EmployeeInput:
      type: object
      required: [displayName, email, phone, locationId, active, workingHours]
      properties:
        displayName: { type: string, minLength: 1, maxLength: 100 }
        publicName: { type: string, maxLength: 100 }
        email: { type: string, maxLength: 200 }
        phone: { type: string, maxLength: 30 }
        locationId: { type: string, format: uuid }
        active: { type: boolean }
        workingHours: { type: array, maxItems: 7, items: { $ref: "#/components/schemas/HourInput" } }
    ManagedEmployee:
      allOf:
        - $ref: "#/components/schemas/EmployeeInput"
        - type: object
          required: [id]
          properties:
            id: { type: string }
            userId: { type: [string, "null"] }
    CategoryInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
    ManagedCategory:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
    VariantInput:
      type: object
      required: [name, priceCents, durationMinutes]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 100 }
        priceCents: { type: integer, minimum: 0, maximum: 10000000 }
        durationMinutes: { type: integer, minimum: 1, maximum: 1440 }
    ServiceInput:
      type: object
      required: [name, description, locationId, priceCents, durationMinutes, preparationMinutes, cleanupMinutes, published, onlineBooking, employeeIds, variants]
      properties:
        name: { type: string, minLength: 1, maxLength: 150 }
        description: { type: string, maxLength: 2000 }
        locationId: { type: string, format: uuid }
        categoryId: { type: [string, "null"] }
        priceCents: { type: integer, minimum: 0, maximum: 10000000 }
        durationMinutes: { type: integer, minimum: 1, maximum: 1440 }
        preparationMinutes: { type: integer, minimum: 0, maximum: 240 }
        cleanupMinutes: { type: integer, minimum: 0, maximum: 240 }
        published: { type: boolean }
        onlineBooking: { type: boolean }
        employeeIds: { type: array, maxItems: 100, items: { type: string, format: uuid } }
        variants: { type: array, maxItems: 30, items: { $ref: "#/components/schemas/VariantInput" } }
    ManagedService:
      allOf:
        - $ref: "#/components/schemas/ServiceInput"
        - type: object
          required: [id, archived]
          properties:
            id: { type: string }
            archived: { type: boolean }
    PolicyInput:
      type: object
      required: [noticeHours, lateFeeType, lateFeeValue, noShowFeeType, noShowFeeValue, waiverAllowed, exceptions]
      properties:
        rescheduleNoticeHours: { type: integer, minimum: 0, maximum: 720 }
        noticeHours: { type: integer, minimum: 0, maximum: 720 }
        lateFeeType: { type: string, enum: [percentage, fixed] }
        lateFeeValue: { type: integer, minimum: 0, maximum: 10000000 }
        noShowFeeType: { type: string, enum: [percentage, fixed] }
        noShowFeeValue: { type: integer, minimum: 0, maximum: 10000000 }
        waiverAllowed: { type: boolean }
        exceptions: { type: string, maxLength: 2000 }
    ManagedPolicy:
      allOf:
        - $ref: "#/components/schemas/PolicyInput"
        - type: object
          required: [id, version, createdAt]
          properties:
            id: { type: string }
            version: { type: integer }
            createdAt: { type: string }
    PublicationInput:
      type: object
      required: [locationId, published]
      properties:
        locationId: { type: string, format: uuid }
        published: { type: boolean }
    MembershipInput:
      type: object
      required: [role, status]
      properties:
        role: { type: string, enum: [manager, employee] }
        status: { type: string, enum: [active, inactive, removed] }
    ManagedMembership:
      type: object
      required: [id, userId, displayName, email, role, status]
      properties:
        id: { type: string }
        userId: { type: string }
        displayName: { type: string }
        email: { type: string }
        role: { type: string }
        status: { type: string }
    InvitationInput:
      type: object
      required: [email, role, locationId]
      properties:
        email: { type: string, format: email, maxLength: 200 }
        role: { type: string, enum: [manager, employee] }
        locationId: { type: string, format: uuid }
    ManagedInvitation:
      type: object
      required: [id, email, role, expiresAt, accepted]
      properties:
        id: { type: string }
        email: { type: string }
        role: { type: string }
        expiresAt: { type: string }
        accepted: { type: boolean }
    InvitationDelivery:
      type: object
      required: [token, expiresAt, message]
      properties:
        token: { type: string }
        expiresAt: { type: string }
        message: { type: string }
    InvitationAcceptance:
      type: object
      required: [token]
      properties:
        token: { type: string, minLength: 32, maxLength: 200 }
    BusinessWorkspace:
      type: object
      required: [id, name, role, isDemo, profile, locations, employees, services, serviceCategories, memberships, invitations, policies, publicationIssues]
      properties:
        id: { type: string }
        name: { type: string }
        role: { type: string, enum: [owner, manager, employee] }
        isDemo: { type: boolean }
        profile: { $ref: "#/components/schemas/OrganizationProfileInput" }
        locations: { type: array, items: { $ref: "#/components/schemas/ManagedLocation" } }
        employees: { type: array, items: { $ref: "#/components/schemas/ManagedEmployee" } }
        services: { type: array, items: { $ref: "#/components/schemas/ManagedService" } }
        serviceCategories: { type: array, items: { $ref: "#/components/schemas/ManagedCategory" } }
        memberships: { type: array, items: { $ref: "#/components/schemas/ManagedMembership" } }
        invitations: { type: array, items: { $ref: "#/components/schemas/ManagedInvitation" } }
        policies: { type: array, items: { $ref: "#/components/schemas/ManagedPolicy" } }
        publicationIssues: { type: array, items: { type: string } }
