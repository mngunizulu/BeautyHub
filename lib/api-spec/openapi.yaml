openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: BeautyHub Stage 1 API. Public development catalog; bookings and account activation are deferred.
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "503":
          description: Database unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /categories:
    get:
      operationId: listCategories
      tags: [marketplace]
      responses:
        "200":
          description: Service categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
  /businesses:
    get:
      operationId: listBusinesses
      tags: [marketplace]
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
        - { name: city, in: query, schema: { type: string, maxLength: 100 } }
        - { name: category, in: query, schema: { type: string, maxLength: 60 } }
        - { name: service, in: query, schema: { type: string, minLength: 1, maxLength: 100 } }
        - { name: maxPriceCents, in: query, description: Maximum price of the matching public service or variant in EUR cents, schema: { type: integer, minimum: 0, maximum: 10000000 } }
        - { name: date, in: query, description: Local date with at least one bookable slot for a matching offering, schema: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' } }
      responses:
        "200":
          description: Published businesses matching all filters
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Business"
        "400":
          $ref: "#/components/responses/BadRequest"
  /businesses/{slug}:
    get:
      operationId: getBusiness
      tags: [marketplace]
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 100, pattern: '^[a-z0-9-]+$' }
      responses:
        "200":
          description: Public business profile with services
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: Business not found or not published
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
  /marketplace/summary:
    get:
      operationId: getMarketplaceSummary
      tags: [marketplace]
      responses:
        "200":
          description: Actual public catalog counts, never simulated reviews or availability
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketplaceSummary"
  /system:
    get:
      operationId: getSystemStatus
      tags: [foundation]
      responses:
        "200":
          description: Public foundation capabilities and stage progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemStatus"
  /auth/session:
    get:
      operationId: getSession
      tags: [auth]
      responses:
        "200":
          description: Fail-closed Stage 1 guest session; managed identity integration is Stage 2
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionStatus"
  /me:
    get:
      operationId: getMyProfile
      tags: [account]
      responses:
        "200":
          description: Current database identity
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserProfile" }
    patch:
      operationId: updateMyProfile
      tags: [account]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProfileInput" }
      responses:
        "200":
          description: Saved profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserProfile" }
  /me/export:
    get:
      operationId: exportMyData
      tags: [account]
      responses:
        "200":
          description: Personal account data export without other tenants' private records
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PersonalExport" }
  /me/deletion-requests/withdraw:
    post:
      operationId: withdrawMyDeletionRequest
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomerDeletionReviewInput" }
      responses:
        "204":
          description: Active request withdrawn
        "409":
          description: Request timestamp changed
  /me/deletion-requests:
    post:
      operationId: requestAccountDeletion
      tags: [account]
      responses:
        "200":
          description: Idempotent deletion workflow request, not instant erasure
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActionResult" }
  /me/payment-methods:
    get:
      operationId: listMyPaymentMethods
      tags: [account]
      responses:
        "200":
          description: Only current user's safe provider associations, no raw card data
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/PaymentReference" } }
  /organizations:
    get:
      operationId: listMyOrganizations
      tags: [business]
      responses:
        "200":
          description: Active memberships only
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/OrganizationSummary" } }
    post:
      operationId: createOrganization
      tags: [business]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrganizationInput" }
      responses:
        "201":
          description: Atomic organization, owner membership, draft location and default policy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BusinessWorkspace" }
  /organizations/{organizationId}/workspace:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      operationId: getOrganizationWorkspace
      tags: [business]
      responses:
        "200":
          description: Authorized tenant workspace
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BusinessWorkspace" }
  /organizations/{organizationId}/profile:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    put:
      operationId: saveOrganizationProfile
      tags: [business]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrganizationProfileInput" }
      responses:
        "200":
          description: Saved organization identity
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BusinessWorkspace" }
  /organizations/{organizationId}/locations:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    post:
      operationId: createBusinessLocation
      tags: [business]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LocationInput" }
      responses:
        "201":
          description: Added draft location
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BusinessWorkspace" }
  /organizations/{organizationId}/locations/{locationId}:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - { name: locationId, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      operationId: saveBusinessLocation
      tags: [business]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LocationInput" }
      responses:
        "200":
          description: Address, opening hours and booking settings saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BusinessWorkspace" }
  /organizations/{organizationId}/employees:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    post:
      operationId: createEmployee
      tags: [business]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmployeeInput" }
      responses:
        "201":
          description: Employee created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BusinessWorkspace" }
  /organizations/{organizationId}/employees/{employeeId}:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - { name: employeeId, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      operationId: saveEmployee
      tags: [business]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmployeeInput" }
      responses:
        "200":
          description: Employee saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BusinessWorkspace" }
  /organizations/{organizationId}/service-categories:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    post:
      operationId: createServiceCategory
      tags: [business]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CategoryInput" }
      responses:
        "201":
          description: Organization-scoped service grouping
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BusinessWorkspace" }
  /organizations/{organizationId}/services:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    post:
      operationId: createBusinessService
      tags: [business]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ServiceInput" }
      responses:
        "201":
          description: Service, variants and assignments saved atomically
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BusinessWorkspace" }
  /organizations/{organizationId}/services/{serviceId}:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - { name: serviceId, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      operationId: saveBusinessService
      tags: [business]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ServiceInput" }
      responses:
        "200":
          description: Updated service
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BusinessWorkspace" }
    delete:
      operationId: archiveBusinessService
      tags: [business]
      responses:
        "200":
          description: Soft archive preserves historical identifiers
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BusinessWorkspace" }
  /organizations/{organizationId}/policy:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    put:
      operationId: saveCancellationPolicy
      tags: [business]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PolicyInput" }
      responses:
        "200":
          description: New immutable policy version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BusinessWorkspace" }
  /organizations/{organizationId}/publication:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    put:
      operationId: setBusinessPublication
      tags: [business]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PublicationInput" }
      responses:
        "200":
          description: Explicit validated publication or unpublication
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BusinessWorkspace" }
  /organizations/{organizationId}/invitations:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    post:
      operationId: createStaffInvitation
      tags: [business]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InvitationInput" }
      responses:
        "201":
          description: Secure share-once invitation link; no email provider activated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvitationDelivery" }
  /organizations/{organizationId}/members/{membershipId}:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - { name: membershipId, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      operationId: saveOrganizationMembership
      tags: [business]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MembershipInput" }
      responses:
        "200":
          description: Owner-controlled access change with audit record
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BusinessWorkspace" }
  /invitations/accept:
    post:
      operationId: acceptStaffInvitation
      tags: [account]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InvitationAcceptance" }
      responses:
        "200":
          description: Recipient-verified atomic single-use invitation acceptance
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationSummary" }
  /business/workspace:
    get:
      operationId: getBusinessWorkspace
      tags: [business]
      responses:
        "401":
          description: Authentication required. No anonymous tenant data access.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
  /admin/workspace:
    get:
      operationId: getAdminWorkspace
      tags: [admin]
      responses:
        "401":
          description: Authentication required. No anonymous administrator access.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
  /businesses/{slug}/gallery:
    parameters:
      - { name: slug, in: path, required: true, schema: { type: string } }
    get:
      operationId: listPublicGallery
      responses:
        "200":
          description: Published gallery
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/GalleryPhoto" } }
  /gallery/{photoId}:
    parameters:
      - { name: photoId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getPublicGalleryImage
      responses:
        "200":
          description: Image bytes
          content:
            image/jpeg:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
            image/webp:
              schema: { type: string, format: binary }
  /organizations/{organizationId}/locations/{locationId}/gallery:
    parameters:
      - { name: organizationId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: locationId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: listManagedGallery
      responses:
        "200":
          description: Tenant gallery
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/GalleryPhoto" } }
    post:
      operationId: uploadGalleryPhoto
      parameters:
        - { name: alt, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 160 } }
      requestBody:
        required: true
        content:
          image/jpeg:
            schema: { type: string, format: binary }
          image/png:
            schema: { type: string, format: binary }
          image/webp:
            schema: { type: string, format: binary }
      responses:
        "201":
          description: Photo stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GalleryPhoto" }
        "413":
          description: Photo exceeds 768 KiB
        "409":
          description: Gallery already has 12 photos
  /organizations/{organizationId}/locations/{locationId}/gallery/{photoId}:
    parameters:
      - { name: organizationId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: locationId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: photoId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getManagedGalleryImage
      responses:
        "200":
          description: Image bytes
          content:
            image/jpeg:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
            image/webp:
              schema: { type: string, format: binary }
    delete:
      operationId: deleteGalleryPhoto
      responses:
        "204":
          description: Photo removed
  /me/favorites:
    get:
      operationId: listMyFavorites
      responses:
        "200":
          description: Published locations saved by the account
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/FavoriteSalon" } }
  /me/favorites/{locationId}:
    parameters:
      - { name: locationId, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      operationId: saveFavorite
      responses:
        "204":
          description: Location saved
    delete:
      operationId: removeFavorite
      responses:
        "204":
          description: Favorite removed

  /businesses/{slug}/booking-quote:
    post:
      operationId: quoteBooking
      description: Calculate a non-reserving quote for online-enabled services and active variants.
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 100, pattern: '^[a-z0-9-]+$' } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BookingQuoteInput" }
      responses:
        "200":
          description: Current server-calculated quote
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookingQuote" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: The salon or any requested offering is unavailable

  /businesses/{slug}/reviews:
    get:
      operationId: listPublicBusinessReviews
      tags: [catalog]
      parameters:
        - { in: path, name: slug, required: true, schema: { type: string } }
        - { in: query, name: sort, schema: { type: string, enum: [newest, highest, lowest] } }
        - { in: query, name: offset, schema: { type: integer, minimum: 0, maximum: 99999 } }
      responses:
        "200":
          description: Public reviews and rating summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicReviewPage" }
  /businesses/{slug}/available-dates:
    post:
      operationId: getBusinessAvailableDates
      tags: [booking]
      parameters:
        - { in: path, name: slug, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AvailableDatesInput" }
      responses:
        "200":
          description: Availability for seven consecutive days
          content:
            application/json:
              schema: { type: array, items: { type: object, required: [date, available], properties: { date: { type: string, format: date }, available: { type: boolean } } } }
  /businesses/{slug}/availability:
    parameters:
      - { name: slug, in: path, required: true, schema: { type: string } }
    post:
      operationId: checkBookingAvailability
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [date, items], properties: { date: { type: string, format: date }, professionalId: { type: string, format: uuid }, items: { type: array, items: { type: object, required: [serviceId], properties: { serviceId: { type: string, format: uuid }, variantId: { type: string, format: uuid } } } } } }
      responses:
        "200":
          description: Quote, current policy and available slots
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookingAvailability" }
  /businesses/{slug}/bookings:
    parameters:
      - { name: slug, in: path, required: true, schema: { type: string } }
    post:
      operationId: createAppointment
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [items, employeeId, startsAt, idempotencyKey, policyVersion, expectedPriceCents, paymentMethodId, acceptPolicy], properties: { items: { type: array, items: { type: object, required: [serviceId], properties: { serviceId: { type: string, format: uuid }, variantId: { type: string, format: uuid } } } }, employeeId: { type: string, format: uuid }, startsAt: { type: string, format: date-time }, idempotencyKey: { type: string, format: uuid }, policyVersion: { type: integer }, expectedPriceCents: { type: integer }, paymentMethodId: { type: string, format: uuid }, acceptPolicy: { type: boolean, enum: [true] }, appointmentNote: { type: string, maxLength: 500 }, expectedEndsAt: { type: string, format: date-time }, expectedProfessionals: { type: array, minItems: 1, maxItems: 12, items: { type: string, format: uuid } } } }
      responses:
        "201":
          description: Booking confirmed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Appointment" }
        "200":
          description: Idempotent replay
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Appointment" }
        "409":
          description: No longer available or quote changed
  /businesses/{slug}/waitlist:
    parameters:
      - { name: slug, in: path, required: true, schema: { type: string } }
    post:
      operationId: joinBookingWaitlist
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [date], properties: { date: { type: string, format: date } } }
      responses:
        "204":
          description: Waitlist entry saved
  /me/bookings:
    get:
      operationId: listMyAppointments
      responses:
        "200":
          description: Customer appointments
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Appointment" } }
  /admin/review-moderation:
    get:
      operationId: listReviewModerationQueue
      parameters:
        - { name: offset, in: query, schema: { type: integer, minimum: 0, maximum: 1000000 } }
      responses:
        "200":
          description: Reviews with open reports and hidden reviews
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReviewModerationPage" }
        "403":
          description: Platform administrator access required
  /admin/review-moderation/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      operationId: moderateReportedReview
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReviewModerationInput" }
      responses:
        "204":
          description: Moderation decision applied
        "403":
          description: Platform administrator access required
        "409":
          description: No open report
  /organizations/{organizationId}/service-packages:
    parameters:
      - { $ref: "#/components/parameters/OrganizationId" }
    get:
      operationId: listOrganizationPackages
      responses:
        "200":
          description: Business package offers
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/ManagedServicePackage" } }
    post:
      operationId: createOrganizationPackage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ServicePackageTerms" }
      responses:
        "201":
          description: Package created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManagedServicePackage" }
  /organizations/{organizationId}/service-packages/{id}:
    parameters:
      - { $ref: "#/components/parameters/OrganizationId" }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      operationId: updateOrganizationPackage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ServicePackageAvailability" }
      responses:
        "200":
          description: Package availability updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManagedServicePackage" }
  /me/service-packages:
    get:
      operationId: listMyServicePackages
      responses:
        "200":
          description: Signed-in customer's simulated package purchases
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/CustomerServicePackage" } }
  /me/service-packages/offers:
    get:
      operationId: listServicePackageOffers
      responses:
        "200":
          description: Packages for public bookable services
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/ServicePackageOffer" } }
  /me/service-packages/offers/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: simulateCustomerPackagePurchase
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ServicePackagePurchaseInput" }
      responses:
        "200":
          description: Simulated purchase recorded
          content:
            application/json:
              schema: { type: object, required: [id], properties: { id: { type: string, format: uuid } } }
