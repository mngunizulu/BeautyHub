x-runtime: &runtime
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  api:
    <<: *runtime
    image: beautyhub-api:${BEAUTYHUB_IMAGE_TAG:?Set a release tag}
    build:
      context: .
      target: api
      args:
        VITE_CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY:?Set the Clerk publishable key}
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set the runtime database connection string}
      CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY:?Set the Clerk publishable key}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:?Set the Clerk secret key}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 8s
      retries: 4

  web:
    <<: *runtime
    image: beautyhub-web:${BEAUTYHUB_IMAGE_TAG:?Set a release tag}
    build:
      context: .
      target: web
      args:
        VITE_CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY:?Set the Clerk publishable key}
    ports:
      - "127.0.0.1:${BEAUTYHUB_HTTP_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1/ > /dev/null"]
      interval: 15s
      timeout: 5s
      retries: 4
